name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version "${{ github.ref_name }}"

      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "GWX Version Control ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" .\dist\GWX-Version-Control-*-windows.zip --clobber
